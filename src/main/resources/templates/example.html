<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thymeleaf Test</title>
</head>
<body>
    <h1>안녕하세요~~ <span th:text="${name}"></span></h1>
    <table>
        <tr th:each="item : ${articles}">
            <td th:text="${item.title}"></td>
            <td th:text="${item.content}"></td>
        </tr>
    </table>

    <div>
<!--        <p th:text="${person.name}"></p>  &lt;!&ndash; person.getName() &ndash;&gt;-->
<!--        <p th:text="${person.age}"></p>-->
<!--        <p th:text="${person.id}"></p>-->
    </div>

    <div th:object="${person}">
        <p th:text="|이름: *{name}|"></p>
        <p th:text="|나이: *{age}|"></p>
        <p th:text="|아이디: *{id}|"></p>
    </div>
    <!-- 취미를 ul 태그를 통해 동적으로 생성되도록 하라 -->
    <ul th:each="hobby: ${person.hobbies}">
        <li th:text="${hobby}"></li>
    </ul>

    <hr/>
    <div th:if="${error != null}">
        에러가 발생했습니다!!!
    </div>
    <div th:unless="${error != null}">
        정상 작동 중
    </div>
    <div th:if="${error == null}">
        정상 작동 중!!
    </div>
</body>
</html>
